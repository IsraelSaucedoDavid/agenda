<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concepto 2 · Apertura radiante: ventana con grosor, sol cálido y anillos concéntricos en el interior -->
  <defs>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#4A3BC4"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E2A78"/>
    </radialGradient>
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A0722" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ventana con grosor (extrusión) -->
  <g filter="url(#tileShadow)">
    <rect x="6.5" y="10" width="51" height="48" rx="14" fill="#3A2C9E"/>
    <rect x="6.5" y="7" width="51" height="48" rx="14" fill="url(#faceGrad)"/>
  </g>

  <!-- luz superior (bevel) -->
  <path d="M20.5 7 A14 14 0 0 1 43.5 7 L41 12 Q32 9.4 23 12 Z" fill="#FFFFFF" opacity="0.28"/>

  <!-- sistema solar interior -->
  <g transform="rotate(-24 32 31)">
    <ellipse cx="32" cy="31" rx="16.5" ry="5.1" fill="none" stroke="url(#ring)" stroke-width="1.1" opacity="0.35"/>
    <ellipse cx="32" cy="31" rx="11" ry="3.4" fill="none" stroke="url(#ring)" stroke-width="1.3" opacity="0.95"/>
  </g>

  <circle cx="32" cy="31" r="12" fill="url(#halo)"/>
  <circle cx="32" cy="31" r="4.8" fill="url(#core)"/>
  <circle cx="32" cy="31" r="1.2" fill="#FFF6E0" opacity="0.9"/>

  <circle cx="46.8" cy="21.9" r="2.4" fill="url(#planet)"/>
  <ellipse cx="46.1" cy="21.4" rx="0.8" ry="0.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 46.1 21.4)"/>

  <circle cx="17.4" cy="38.7" r="1.4" fill="#F9A8D4"/>
</svg>
