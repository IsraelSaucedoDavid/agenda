<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concepto 1 · Órbita radiante (negativo sobre espacio profundo), halo cálido, campo de estrellas -->
  <defs>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E2A78"/>
    </radialGradient>
  </defs>

  <!-- estrellas -->
  <g fill="#FFFFFF">
    <circle cx="10" cy="12" r="0.9" opacity="0.8"/>
    <circle cx="52" cy="8" r="0.8" opacity="0.6"/>
    <circle cx="60" cy="24" r="1" opacity="0.9"/>
    <circle cx="7" cy="48" r="0.8" opacity="0.7"/>
    <circle cx="22" cy="58" r="0.9" opacity="0.6"/>
    <circle cx="46" cy="56" r="0.7" opacity="0.8"/>
  </g>

  <!-- anillos concéntricos -->
  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="29" ry="8.8" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="32" cy="32" rx="21.5" ry="6.5" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity="0.65"/>
    <ellipse cx="32" cy="32" rx="14" ry="4.3" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.95"/>
  </g>

  <!-- halo + sol -->
  <circle cx="32" cy="32" r="15" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="5.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="1.4" fill="#FFF6E0" opacity="0.9"/>

  <!-- planeta 3D -->
  <circle cx="58.5" cy="20.2" r="2.8" fill="url(#planet)"/>
  <ellipse cx="57.7" cy="19.5" rx="0.9" ry="0.6" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 57.7 19.5)"/>

  <!-- satélite rosa -->
  <circle cx="19.7" cy="40.5" r="1.5" fill="#F9A8D4"/>
</svg>
