<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Favicon: sol radiante + anillos concéntricos, legible a 16px -->
  <defs>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-24 16 16)">
    <ellipse cx="16" cy="16" rx="12" ry="3.7" fill="none" stroke="url(#ring)" stroke-width="1.1" opacity="0.35"/>
    <ellipse cx="16" cy="16" rx="8.2" ry="2.5" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.95"/>
  </g>

  <circle cx="16" cy="16" r="9" fill="url(#halo)"/>
  <circle cx="16" cy="16" r="4" fill="url(#core)"/>
  <circle cx="16" cy="16" r="1.1" fill="#FFF6E0" opacity="0.9"/>
</svg>
