<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Concepto 3 · Monograma radiante: sello con bevel sobre espacio profundo, sol cálido de marca -->
  <defs>
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2168"/>
      <stop offset="0.5" stop-color="#171041"/>
      <stop offset="1" stop-color="#0B0726"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="sealShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bevelGrad)"/>
  </g>

  <!-- luz superior (bevel) -->
  <path d="M18 2 A14 14 0 0 1 46 2 L43 10 Q32 6.4 21 10 Z" fill="#FFFFFF" opacity="0.16"/>

  <text x="31" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#F1EEFF" text-anchor="middle">E</text>

  <!-- sol cálido -->
  <circle cx="47" cy="17" r="5.5" fill="url(#halo)"/>
  <circle cx="47" cy="17" r="4.2" fill="url(#core)"/>
  <circle cx="47" cy="17" r="1.1" fill="#FFF6E0" opacity="0.9"/>
</svg>
