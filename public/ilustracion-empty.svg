<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <!-- Estado vacío radiante: tu órbita en el amanecer estelar, sol con volumen flotando sobre la luz -->
  <defs>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#5B4BD8"/>
      <stop offset="100%" stop-color="#D99A2B"/>
    </linearGradient>
    <radialGradient id="sat3d" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.5" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#B37B14"/>
    </radialGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="320" height="220" fill="#F8F6FF"/>

  <!-- órbita externa (pendiente de llenarse) -->
  <ellipse cx="160" cy="110" rx="92" ry="34" transform="rotate(-12 160 110)" stroke="#CFC7F5" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- sombra flotante del sistema -->
  <ellipse cx="160" cy="142" rx="24" ry="4.6" fill="#0A0722" opacity="0.12" filter="url(#softShadow)"/>

  <!-- anillos concéntricos -->
  <g transform="rotate(-12 160 110)">
    <ellipse cx="160" cy="110" rx="80" ry="27" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="160" cy="110" rx="58" ry="19.5" fill="none" stroke="url(#ring)" stroke-width="1.7" opacity="0.6"/>
    <ellipse cx="160" cy="110" rx="38" ry="12.8" fill="none" stroke="url(#ring)" stroke-width="1.9" opacity="0.95"/>
  </g>

  <!-- halo + sol con volumen -->
  <circle cx="160" cy="110" r="26" fill="url(#halo)"/>
  <circle cx="160" cy="110" r="10" fill="url(#core)"/>
  <ellipse cx="156.5" cy="105.5" rx="3" ry="2" fill="#FFFFFF" opacity="0.8" transform="rotate(-22 156.5 105.5)"/>
  <circle cx="160" cy="110" r="2" fill="#FFF6E0" opacity="0.9"/>

  <!-- satélite supernova 3D sobre el anillo interior -->
  <circle cx="197.2" cy="102.1" r="4.5" fill="url(#sat3d)"/>
  <ellipse cx="195.9" cy="100.9" rx="1.4" ry="0.9" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 195.9 100.9)"/>

  <!-- estrellas -->
  <circle cx="222" cy="85" r="6" fill="#8B7CFF"/>
  <circle cx="118" cy="60" r="3.5" fill="#C2415F"/>
  <circle cx="205" cy="150" r="4" fill="#D99A2B"/>
</svg>
