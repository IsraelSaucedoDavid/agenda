<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Ilustración de login "Órbita radiante": sol cálido con halo + anillos concéntricos con gradiente, esferas 3D, paralaje -->
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2A1A4A"/>
      <stop offset="45%" stop-color="#160F33"/>
      <stop offset="100%" stop-color="#080513"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="30%" stop-color="#FFD27A"/>
      <stop offset="65%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB85C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E2A78"/>
    </radialGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EEFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#F1EEFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#space)"/>

  <ellipse cx="130" cy="120" rx="150" ry="150" fill="url(#neb1)"/>
  <ellipse cx="560" cy="150" rx="160" ry="140" fill="url(#neb2)"/>
  <ellipse cx="520" cy="410" rx="170" ry="150" fill="url(#neb3)"/>

  <g fill="#FFFFFF">
    <circle cx="70" cy="70" r="1.3" opacity="0.9"/>
    <circle cx="150" cy="45" r="0.9" opacity="0.7"/>
    <circle cx="240" cy="90" r="1.1" opacity="0.8"/>
    <circle cx="330" cy="40" r="0.8" opacity="0.6"/>
    <circle cx="420" cy="80" r="1.4" opacity="0.95"/>
    <circle cx="520" cy="55" r="0.9" opacity="0.7"/>
    <circle cx="610" cy="95" r="1.2" opacity="0.85"/>
    <circle cx="60" cy="200" r="1" opacity="0.7"/>
    <circle cx="35" cy="320" r="1.3" opacity="0.9"/>
    <circle cx="90" cy="430" r="0.9" opacity="0.6"/>
    <circle cx="180" cy="470" r="1.2" opacity="0.85"/>
    <circle cx="300" cy="490" r="0.8" opacity="0.6"/>
    <circle cx="420" cy="470" r="1.1" opacity="0.8"/>
    <circle cx="560" cy="480" r="1" opacity="0.7"/>
    <circle cx="640" cy="330" r="1.3" opacity="0.9"/>
    <circle cx="655" cy="230" r="0.9" opacity="0.7"/>
    <circle cx="470" cy="180" r="0.8" opacity="0.6"/>
    <circle cx="215" cy="150" r="0.9" opacity="0.6"/>
  </g>

  <g transform="translate(340 265) rotate(-24)">
    <ellipse cx="0" cy="0" rx="290" ry="96" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="228" ry="74" fill="none" stroke="url(#ring)" stroke-width="1.8" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="168" ry="52" fill="none" stroke="url(#ring)" stroke-width="2.2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="112" ry="34" fill="none" stroke="url(#ring)" stroke-width="2.4" opacity="0.95"/>

    <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#halo)"/>
    <circle cx="0" cy="0" r="46" fill="url(#core)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#FFF2CC" stroke-width="0.6" opacity="0.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFF6E0" opacity="0.9"/>

    <circle cx="168" cy="0" r="9" fill="url(#planet)"/>
    <ellipse cx="166.6" cy="4.2" rx="2.4" ry="1.6" fill="#FFFFFF" opacity="0.8" transform="rotate(-22 166.6 4.2)"/>
    <circle cx="168" cy="0" r="9" fill="none" stroke="#BFDBFE" stroke-width="0.5" opacity="0.5"/>
    <circle cx="-198" cy="38" r="5.5" fill="#F9A8D4"/>
    <circle cx="82" cy="-30" r="4" fill="#A5F3FC"/>
  </g>

  <!-- estrella fugaz -->
  <line x1="620" y1="92" x2="556" y2="156" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round"/>

  <!-- estrellas en primer plano (con resplandor, capa frontal) -->
  <g>
    <circle cx="150" cy="90" r="6" fill="#5CC8FF" opacity="0.35" filter="url(#starGlow)"/>
    <circle cx="150" cy="90" r="2" fill="#F1EEFF"/>
    <circle cx="700" cy="180" r="5" fill="#FFC24B" opacity="0.35" filter="url(#starGlow)"/>
    <circle cx="700" cy="180" r="1.8" fill="#FFF4D6"/>
    <circle cx="330" cy="520" r="5" fill="#8B7CFF" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="330" cy="520" r="1.8" fill="#E7E1FF"/>
  </g>
</svg>
