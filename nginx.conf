server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Headers de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), display-capture=()" always;
    # HSTS: el navegador solo lo procesa sobre HTTPS (el proxy termina el TLS),
    # así que el header viaja seguro aunque internamente la petición sea HTTP.
    # Sin includeSubDomains/preload para no bloquear el dominio si algún día se
    # sirve por HTTP o se cambia el certificado antes de que expire el max-age.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://supabase.saucedocode.com https://*.googleusercontent.com https://*.google.com; font-src 'self' data:; connect-src 'self' https://supabase.saucedocode.com wss://supabase.saucedocode.com; media-src 'self' blob: https://supabase.saucedocode.com; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://*.spotify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Si el TLS se termina en la capa del proxy (Portainer/Traefik), el HSTS
    # de aquí arriba ya llega al navegador a través del proxy; no es necesario
    # duplicarlo ahí.

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para assets estáticos (los add_header del server se heredan)
    location ~* \.(?:css|js|woff2?|png|svg|ico)$ {
        expires 1y;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
