# --- Rate limiting (nivel http: este archivo se incluye en el contexto http) ---
# Limita por IP real del cliente. El proxy termina el TLS y reenvía la IP real
# en X-Forwarded-For; se confían las redes internas (Docker/Traefik).
# 15 r/s promedio con ráfaga de 40 permite cargar la SPA con normalidad y frena
# abuso (scrapers, hammering, brute force sobre el HTML/404).
# NOTA: los endpoints sensibles de Supabase (auth/token, etc.) viven en
# supabase.saucedocode.com y NO pasan por este nginx; para frenar brute force
# sobre ellos hay que limitar en el gateway de Supabase (Kong), no aquí.
limit_req_zone $binary_remote_addr zone=frontend:10m rate=15r/s;
limit_req_status 429;

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name localhost;

    limit_req zone=frontend burst=40 nodelay;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Headers de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), display-capture=()" always;
    # HSTS: el navegador solo lo procesa sobre HTTPS (el proxy termina el TLS),
    # así que el header viaja seguro aunque internamente la petición sea HTTP.
    # Sin includeSubDomains/preload para no bloquear el dominio si algún día se
    # sirve por HTTP o se cambia el certificado antes de que expire el max-age.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://supabase.saucedocode.com https://*.googleusercontent.com https://*.google.com; font-src 'self' data:; connect-src 'self' https://supabase.saucedocode.com wss://supabase.saucedocode.com; media-src 'self' blob: https://supabase.saucedocode.com; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://*.spotify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Si el TLS se termina en la capa del proxy (Portainer/Traefik), el HSTS
    # de aquí arriba ya llega al navegador a través del proxy; no es necesario
    # duplicarlo ahí.

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para assets estáticos (los add_header del server se heredan)
    location ~* \.(?:css|js|woff2?|png|svg|ico)$ {
        expires 1y;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
